name: Restore database from backup

# Manual only. This is the other half of neon-backup.yml: that job proves a
# dump can be produced, this one proves it can be used. A backup nobody has
# ever restored is a hope, not a backup.
#
# Written on 20 Sep 2026, when the production Neon project exhausted its free
# monthly compute allowance and refused every connection, reads included, with
# eleven days left in the month. The data was fine and completely unreachable.
# The most recent verified dump was from 07:25 that morning, less than two
# hours before the outage -- and the only way to it ran through repository
# secrets, so it needed a job like this one.
on:
  workflow_dispatch:
    inputs:
      dump:
        description: 'Dump file name, or "latest"'
        required: true
        default: 'latest'
      confirm:
        description: 'Type RESTORE to actually write. Anything else lists only.'
        required: true
        default: 'list-only'

permissions:
  contents: read

concurrency:
  group: database-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
      RESTORE_TARGET_DATABASE_URL: ${{ secrets.RESTORE_TARGET_DATABASE_URL }}
      NEON_DIRECT_DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
    steps:
      - name: List available dumps
        id: list
        shell: bash
        run: |
          # GitHub runs step scripts under `bash -e`, so the first non-zero
          # command aborts the step. That is the wrong behaviour for a step
          # whose job is to find out what is in the bucket: the listing
          # failing is the thing we need to see and recover from, not a
          # reason to stop. Turned off explicitly -- `set -uo pipefail` does
          # not clear an `-e` that was set on the interpreter's command line.
          set +e
          set -uo pipefail
          prefix="${BACKUP_S3_PREFIX:-postgres}"
          endpoint_args=()
          [[ -n "${BACKUP_S3_ENDPOINT:-}" ]] && endpoint_args+=(--endpoint-url "$BACKUP_S3_ENDPOINT")
          aws configure set aws_access_key_id "$BACKUP_S3_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$BACKUP_S3_SECRET_ACCESS_KEY"
          aws configure set region "$BACKUP_S3_REGION"

          # `aws s3 ls` failed here against Cloudflare R2 with
          # "(NoSuchKey) ... ListObjectsV2", which is not what an empty or
          # missing prefix returns -- that is an empty list. The high-level
          # `s3` commands wrap several calls; `s3api list-objects-v2` is the
          # single call we actually want, and R2 answers it.
          list_keys() {  # $1 = prefix, empty for the whole bucket
            local prefix_args=()
            [[ -n "${1:-}" ]] && prefix_args=(--prefix "$1")
            aws s3api list-objects-v2 \
              --bucket "$BACKUP_S3_BUCKET" \
              "${prefix_args[@]}" "${endpoint_args[@]}" \
              --query 'Contents[].[Key,Size]' --output text 2>&1
          }

          keys="$(list_keys "$prefix/")"
          if [[ $? -ne 0 || -z "$keys" || "$keys" == "None" ]]; then
            echo "::warning::No objects under '$prefix/'. Listing the whole bucket."
            echo "  (response was: ${keys:0:200})"
            keys="$(list_keys "")"
          fi

          {
            echo "## Objects in the backup bucket"
            echo '```'
            echo "${keys:-(nothing returned)}" | tail -25
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          name='${{ inputs.dump }}'
          if [[ "$name" == "latest" ]]; then
            # Keys carry an ISO-8601 stamp, so lexical order is chronological.
            name="$(echo "$keys" | awk '/\.dump/ {print $1}' | sort | tail -1)"
          fi
          if [[ -z "$name" || "$name" == "latest" ]]; then
            echo "No dump found. Re-run with an explicit key from the listing above." >&2
            exit 1
          fi
          echo "selected=$name" >> "$GITHUB_OUTPUT"
          echo "Selected: \`$name\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Download and inspect the dump
        shell: bash
        run: |
          set -euo pipefail
          prefix="${BACKUP_S3_PREFIX:-postgres}"
          endpoint_args=()
          [[ -n "${BACKUP_S3_ENDPOINT:-}" ]] && endpoint_args+=(--endpoint-url "$BACKUP_S3_ENDPOINT")
          # `selected` is a full key from the listing, so it already
          # carries whatever prefix the object really lives under -- which is
          # the point, given the prefix is what went wrong above.
          aws s3api get-object --bucket "$BACKUP_S3_BUCKET" \
            --key "${{ steps.list.outputs.selected }}" \
            "${endpoint_args[@]}" "$RUNNER_TEMP/restore.dump" >/dev/null

          size="$(du -h "$RUNNER_TEMP/restore.dump" | cut -f1)"
          echo "## Dump contents" >> "$GITHUB_STEP_SUMMARY"
          echo "Compressed size on disk: **$size**" >> "$GITHUB_STEP_SUMMARY"

          # The table list doubles as the integrity check the backup job runs,
          # and tells us whether the restore will fit a 0.5 GB free tier.
          docker run --rm -v "$RUNNER_TEMP:/backup" postgres:18-alpine \
            pg_restore --list /backup/restore.dump > "$RUNNER_TEMP/toc.txt"
          echo "Objects in dump: $(wc -l < "$RUNNER_TEMP/toc.txt")" >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight the target
        if: ${{ env.RESTORE_TARGET_DATABASE_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Runs before any write, including on a list-only run, because the
          # three things below decide whether a restore will work at all and
          # are far cheaper to learn now than halfway through one.
          #
          #  - server_version: pg_restore reads a custom-format dump written
          #    by pg_dump 18. An older server rejects it outright.
          #  - max_connections: a small managed plan can sit near 20. The app
          #    opens a Prisma pool AND a separate LISTEN/NOTIFY pool per
          #    instance, so this is the number that decides how they must be
          #    sized -- see DB_POOL_MAX / PUBSUB_POOL_MAX.
          #  - a non-empty target means something is already there, and
          #    --clean --if-exists is about to drop it.
          docker run --rm -e RESTORE_TARGET_DATABASE_URL postgres:18-alpine sh -ec '
            psql "$RESTORE_TARGET_DATABASE_URL" -At -F" | " -c "
              select current_setting(\'server_version\'),
                     current_setting(\'max_connections\'),
                     pg_size_pretty(pg_database_size(current_database())),
                     (select count(*) from pg_tables where schemaname = \'public\')"
          ' | tee "$RUNNER_TEMP/preflight.txt"
          {
            echo "## Target preflight"
            echo '```'
            echo "server_version | max_connections | size | public tables"
            cat "$RUNNER_TEMP/preflight.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse to overwrite the live database
        if: ${{ inputs.confirm == 'RESTORE' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RESTORE_TARGET_DATABASE_URL:-}" ]]; then
            echo "RESTORE_TARGET_DATABASE_URL is not set. Add it as a repository" >&2
            echo "secret pointing at the NEW database before restoring." >&2
            exit 1
          fi
          # A restore is destructive and a paste is easy to get wrong. The
          # target must not be the database the backup was taken from.
          host_of() { sed -E 's#^[^@]*@##; s#[:/?].*$##' <<< "$1"; }
          if [[ "$(host_of "$RESTORE_TARGET_DATABASE_URL")" \
             == "$(host_of "${NEON_DIRECT_DATABASE_URL:-none}")" ]]; then
            echo "Refusing: the restore target is the same host as the backup source." >&2
            exit 1
          fi
          echo "Target host differs from the backup source. Proceeding."

      - name: Restore
        if: ${{ inputs.confirm == 'RESTORE' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e RESTORE_TARGET_DATABASE_URL \
            -v "$RUNNER_TEMP:/backup" postgres:18-alpine \
            sh -ec 'pg_restore --no-owner --no-privileges --clean --if-exists \
              --dbname="$RESTORE_TARGET_DATABASE_URL" /backup/restore.dump'
          echo "Restored ${{ steps.list.outputs.selected }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Report target size
        if: ${{ inputs.confirm == 'RESTORE' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e RESTORE_TARGET_DATABASE_URL postgres:18-alpine \
            sh -ec 'psql "$RESTORE_TARGET_DATABASE_URL" -At -c
              "select pg_size_pretty(pg_database_size(current_database()))"' \
            | tee -a "$GITHUB_STEP_SUMMARY"
