name: CI

# Nothing has ever gated a push to this repository. The batch that shipped
# scratchpads, drawings, vision grading, folders and global search was verified
# only by `tsc`, `eslint` and `next build` -- and reached production with the
# drawing canvas crashing the whole app on mount, past papers rendering as a
# blank 150px sliver, and global search returning nothing for the largest
# corpus on the platform. Every one of those is caught by a browser opening the
# page once.
#
# So this runs the cheap checks on every push, and the Playwright suite on a
# schedule and on demand, where it can be pointed at a real deployment. The e2e
# job is deliberately not a required gate on a push: it needs a running server
# and a seeded account, which a fork's PR cannot have.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # After the nightly backup, so a failure has a fresh snapshot behind it.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      folder_fixtures:
        description: 'Run the folder specs (leaves folders in the LIVE library that only an admin can remove)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # `npm test` runs three Python suites (bank, question images,
      # catalogue) alongside the Node ones, and they import pymupdf, pillow
      # and opencv. Without these the whole `test` script fails on import,
      # not on an assertion.
      - name: Install the Python test dependencies
        run: pip install -r pdf_extraction/requirements.txt

      - run: npm ci

      # The Prisma client is generated, not committed, and both `tsc` and the
      # build need it before they can resolve `@prisma/client`.
      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        # A build needs the env-var surface `lib/env.ts` validates at import
        # time. These are placeholders: nothing in a build talks to either.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
        run: npm run build

  e2e:
    name: Playwright
    # Not on pull_request: a fork has no access to the secrets below, and a
    # skipped-but-red job teaches people to ignore this workflow.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # The folder specs create folders in the LIVE resource library and
      # cannot clean up after themselves: deleting a folder is admin-only by
      # design and this suite runs as a student. Unattended, that left test
      # scaffolding sitting in a shelf the whole year group can see, every
      # night. So they run only when a human asks for them.
      #
      # That ask is now the checkbox on the Run workflow button, not the mere
      # fact of dispatching. Keying it to `github.event_name` meant the only
      # way to run the suite by hand was also the way that dirtied production,
      # so nobody could re-run a failed nightly without leaving litter -- and
      # on 29 Sep that stopped a red nightly from being re-checked at all.
      E2E_FOLDER_FIXTURES: ${{ inputs.folder_fixtures == true }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${E2E_BASE_URL:-}" ]] && missing+=(E2E_BASE_URL)
          [[ -z "${E2E_EMAIL:-}" ]] && missing+=(E2E_EMAIL)
          [[ -z "${E2E_PASSWORD:-}" ]] && missing+=(E2E_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "Missing required repository secrets: ${missing[*]}" >&2
            echo "Point E2E_BASE_URL at a deployment and seed E2E_EMAIL as a student account." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        run: npm run e2e

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
