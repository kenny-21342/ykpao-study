name: Page Yjs compaction

# Feature 5 (collaborative page editing) is flagged off by default
# (YJS_COLLAB=on to enable in lib/stream-config.ts). This job only touches
# pages that have accumulated PageYjsUpdate rows, which is none of them
# while the flag stays off everywhere, so it is safe to run on a schedule
# even before anyone opts in -- it just does nothing.
#
# Runs here rather than as a Vercel cron for the same reason the RAG reindex
# does: it's a maintenance sweep across the whole table, not a per-request
# operation, and the runner already holds the production database
# credential.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-yjs-compact
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DIRECT_DATABASE_URL }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "Missing required repository secret: DATABASE_URL" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Compact Yjs update logs
        run: npx tsx scripts/compact-page-yjs-updates.ts --apply
