name: Database backup

on:
  # Keep an independent copy outside Neon's point-in-time history window.
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # BACKUP_DATABASE_URL is the live database, whoever is hosting it this
      # month. It used to fall back to NEON_DIRECT_DATABASE_URL, the old name;
      # that fallback was removed on 26 Sep when both Neon projects were
      # deleted, because it had stopped being a safety net and become a way for
      # a missing secret to fail confusingly instead of loudly.
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
      # Defaults to 90 to match the window /privacy promises students.
      BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
    steps:
      - name: Validate backup configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            BACKUP_DATABASE_URL \
            BACKUP_S3_BUCKET \
            BACKUP_S3_ACCESS_KEY_ID \
            BACKUP_S3_SECRET_ACCESS_KEY \
            BACKUP_S3_REGION; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

      - name: Dump and verify the database
        id: dump
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          file="ykpao-study-${stamp}.dump"
          # The server runs PostgreSQL 18 (Neon did, Aiven does); use the
          # matching client so pg_dump can read it without a version mismatch.
          docker run --rm \
            -e BACKUP_DATABASE_URL \
            -v "$RUNNER_TEMP:/backup" \
            postgres:18-alpine \
            sh -ec 'pg_dump --format=custom --no-owner --no-privileges \
              --dbname="$BACKUP_DATABASE_URL" --file="/backup/'"$file"'"'
          docker run --rm \
            -v "$RUNNER_TEMP:/backup" \
            postgres:18-alpine \
            pg_restore --list "/backup/$file" >/dev/null
          echo "file=$file" >> "$GITHUB_OUTPUT"
          # Name the host and size in the summary. The 19 Sep dump was the
          # only reason the platform survived the Neon outage, and the runs
          # after it failed for a day without anyone noticing -- a backup job
          # that says nothing when it works says nothing when it stops, too.
          host="$(sed -E 's#^[^@]*@##; s#[:/?].*$##' <<< "$BACKUP_DATABASE_URL")"
          echo "Dumped **$host** -> \`$file\` ($(du -h "$RUNNER_TEMP/$file" | cut -f1))" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified dump
        shell: bash
        run: |
          set -euo pipefail
          prefix="${BACKUP_S3_PREFIX:-postgres}"
          endpoint_args=()
          if [[ -n "${BACKUP_S3_ENDPOINT:-}" ]]; then
            endpoint_args+=(--endpoint-url "$BACKUP_S3_ENDPOINT")
          fi
          aws configure set aws_access_key_id "$BACKUP_S3_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$BACKUP_S3_SECRET_ACCESS_KEY"
          aws configure set region "$BACKUP_S3_REGION"
          aws s3 cp \
            "$RUNNER_TEMP/${{ steps.dump.outputs.file }}" \
            "s3://$BACKUP_S3_BUCKET/$prefix/${{ steps.dump.outputs.file }}" \
            "${endpoint_args[@]}" \
            --only-show-errors
      - name: Delete backups past the retention window
        shell: bash
        run: |
          set -euo pipefail
          # This is what makes the "kept for up to 90 days" sentence in
          # /privacy true. Until 27 Sep nothing deleted anything: the upload
          # above was the whole job, so a dump -- and every deleted account
          # inside it -- was kept forever. docs/PRODUCTION_OPERATIONS.md had
          # carried "configure object-storage lifecycle retention on the
          # bucket" as a manual step since the workflow was written, and it
          # was never done.
          #
          # A bucket lifecycle rule is still the better mechanism, because it
          # holds even when this workflow does not run. It is a backstop to
          # add in the Cloudflare console, not a replacement for this: a rule
          # nobody can see in the repository is a rule nobody remembers to
          # check, and this step prints what it removed.
          prefix="${BACKUP_S3_PREFIX:-postgres}"
          days="${BACKUP_RETENTION_DAYS:-90}"
          # A floor, not a default. Someone typing 1 here would destroy the
          # backup history on the next run, and the doc's stated minimum is 30.
          if [[ ! "$days" =~ ^[0-9]+$ ]] || (( days < 30 )); then
            echo "BACKUP_RETENTION_DAYS must be a whole number of at least 30; got '${days}'" >&2
            exit 1
          fi
          endpoint_args=()
          if [[ -n "${BACKUP_S3_ENDPOINT:-}" ]]; then
            endpoint_args+=(--endpoint-url "$BACKUP_S3_ENDPOINT")
          fi
          aws configure set aws_access_key_id "$BACKUP_S3_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$BACKUP_S3_SECRET_ACCESS_KEY"
          aws configure set region "$BACKUP_S3_REGION"

          # A failure here must never fail the job. The dump is already uploaded
          # by this point, and housekeeping that cannot run is not a reason to
          # report the backup as broken -- that inverts which half matters.
          #
          # It is currently expected to fail, and the warning is the point.
          # This step broke the nightly backup on its first scheduled run
          # (27 Sep, `NoSuchKey`, run 36306020877) and the cause is a
          # pre-existing misconfiguration this step merely exposed:
          # BACKUP_S3_ENDPOINT carries the bucket name on the end of the URL.
          # PutObject still works, because the extra segment simply becomes
          # part of the key -- which is why every dump is really stored under
          # `<bucket>/<bucket>/postgres/`. But a list is a GET on the bucket
          # URL, so the extra segment makes it a GET on a *key* instead, and
          # R2 answers NoSuchKey. No prefix or list command fixes that from
          # here; removing the bucket name from the BACKUP_S3_ENDPOINT secret
          # does, and the existing dumps then need moving to match.
          if ! aws s3api list-objects-v2 \
            --bucket "$BACKUP_S3_BUCKET" \
            --prefix "$prefix/" \
            "${endpoint_args[@]}" \
            --query 'Contents[].{Key:Key,LastModified:LastModified}' \
            --output json > "$RUNNER_TEMP/backups.json" 2> "$RUNNER_TEMP/list-error.txt"; then
            echo "::warning::Retention could not list the bucket, so nothing was deleted. The dump itself uploaded fine. $(head -c 300 "$RUNNER_TEMP/list-error.txt")"
            echo "Retention: **skipped** — could not list the bucket. The dump uploaded normally." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cutoff="$(date -u -d "$days days ago" +%Y-%m-%dT%H:%M:%SZ)"
          # Two guards beyond the age test, because this step deletes.
          #
          # Only keys this workflow itself writes are eligible -- same prefix,
          # same `ykpao-study-*.dump` name. If the bucket is ever shared with
          # anything else, nothing else is touchable.
          #
          # And the newest few survive regardless of age. Without that, a
          # workflow paused for longer than the window would find every object
          # expired on the run that resumed it and delete the entire history in
          # one pass, leaving exactly one backup: the one made seconds earlier,
          # by a job whose health nobody had been watching.
          doomed="$(jq -r --arg cutoff "$cutoff" --arg prefix "$prefix" --argjson keep 7 '
            (. // [])
            | map(select(
                (.Key | startswith($prefix + "/"))
                and (.Key | contains("/ykpao-study-"))
                and (.Key | endswith(".dump"))
              ))
            | sort_by(.LastModified) | reverse
            | .[$keep:]
            | map(select(.LastModified < $cutoff))
            | .[].Key
          ' "$RUNNER_TEMP/backups.json")"

          if [[ -z "$doomed" ]]; then
            echo "Retention ${days}d: nothing older than \`$cutoff\` to delete." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          count=0
          while IFS= read -r key; do
            [[ -n "$key" ]] || continue
            aws s3api delete-object \
              --bucket "$BACKUP_S3_BUCKET" \
              --key "$key" \
              "${endpoint_args[@]}" >/dev/null
            echo "- \`$key\`" >> "$GITHUB_STEP_SUMMARY"
            count=$((count + 1))
          done <<< "$doomed"
          echo "Retention ${days}d: deleted **$count** backup(s) older than \`$cutoff\`." \
            >> "$GITHUB_STEP_SUMMARY"
