name: RAG reindex

# Uploads and note edits index themselves as they are written, through
# refreshRagIndex. This job is for what those hooks cannot see: records deleted
# outside a request, rows changed by a script or a migration, and content that
# was added before its indexer existed. It also prunes documents whose source
# record is gone -- the index once carried 857 of those.
#
# It runs here rather than as a Vercel cron because a full rebuild walks every
# published bank question, which does not fit in a function timeout. The runner
# already holds the production database credential for the nightly backup.
on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag-reindex
  cancel-in-progress: false

jobs:
  reindex:
    runs-on: ubuntu-latest
    # Six hours is GitHub's ceiling for a job; this sits just under it.
    #
    # 60 was set when the corpus was mostly empty. Transcription filled 65,572
    # questions, and `reindexRagCorpus` rebuilds *everything* on every run, so a
    # full pass is now ~100,000 documents. The 28 Sep 2026 run was killed at
    # exactly 1h00m32s having refreshed 24,030 of them -- and because the walk
    # starts from the beginning each week, the same opening quarter would be
    # redone every Sunday and the rest never reached.
    timeout-minutes: 350
    env:
      # The reindexer reads and writes through Prisma, so it wants the pooled
      # URL the app uses, not the direct one pg_dump needs.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STORAGE_DRIVER: s3
      STORAGE_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      STORAGE_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      STORAGE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      STORAGE_REGION: auto
      STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "Missing required repository secret: DATABASE_URL" >&2
            exit 1
          fi
          # Storage is only needed to read the text out of uploaded files. When
          # it is absent the run still rebuilds everything else, and resources
          # fall back to title and description -- so warn rather than fail.
          if [[ -z "${STORAGE_BUCKET:-}" || -z "${STORAGE_ENDPOINT:-}" ]]; then
            echo "::warning::Object storage is not configured; uploaded files will be indexed by title only."
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      # Newly transcribed questions first, cheaply.
      #
      # This visits only questions that have text and no `rag_documents` row, so
      # once it has caught up it costs almost nothing -- and it runs first so
      # that if the full pass below is cut short, the content added since the
      # last run is indexed rather than the content that already was. Filling
      # `bodyMd` with SQL bypasses `refreshRagIndex` entirely, so without this
      # a transcription push is invisible to search until a full rebuild lands.
      - name: Index newly transcribed bank questions
        run: npx tsx scripts/reindex-bank.ts

      # Then everything the incremental pass cannot see: notes, resources,
      # announcements, threads, the legacy past-paper corpus -- and the prune of
      # documents whose source record is gone, which once cleared 857 of them.
      - name: Rebuild the index
        run: npx tsx scripts/reindex-rag.ts
